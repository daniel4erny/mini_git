services:
  fastapi_api:
    build: ./api
    ports:
      - "8092:3000"
    environment:
      SITE_PASSWORD: ${SITE_PASSWORD:?SITE_PASSWORD missing in .env}
    volumes:
      - git_data:/data
  web:
    build: ./web
    ports:
      - "8091:80"
      - "8443:80"
    depends_on:
      - fastapi_api

volumes:
  git_data:
